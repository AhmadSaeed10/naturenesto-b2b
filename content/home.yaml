how_it_works:
  show: true
  eyebrow: HOW NATURE NESTO WORKS
  title: How Nature Nesto Works
  steps:
    - number: "01"
      title: Share Your Space
      body: Whether it’s your home, office, café, or any other area — share a few details and images with us. Let us know your space dimensions, vibe, lighting, and any inspirations or mood boards you love.
    - number: "02"
      title: Get a Personalized Plan
      body: Our team of plant stylists and designers will curate a tailored concept just for you — including recommended indoor/outdoor plants, decorative pieces, custom artwork or posters, and layout ideas to bring it all together.
    - number: "03"
      title: Choose What You Love
      body: From the curated plan, select the items and services you love most — plants, pots, artwork, or full styling. Need something custom? No worries, we’ve got you covered.
    - number: "04"
      title: We Deliver & Style It
      body: Once you confirm, we prepare everything with care and deliver it to your doorstep. If you opt for our styling services, we’ll help set everything up — from plant placement to art installation.
    - number: "05"
      title: Ongoing Plant Care
      body: For businesses and busy clients, we also offer ongoing plant maintenance services to keep everything fresh, vibrant, and healthy all year round.
