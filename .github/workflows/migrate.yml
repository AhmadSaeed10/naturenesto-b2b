name: Migrate

# Applies committed migrations to the Neon database after they reach main. Files already
# applied (including ones applied from a laptop) are skipped; an edited file fails the run.
on:
  push:
    branches: [main]
    paths: ["db/migrations/**"]
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "DATABASE_URL_UNPOOLED is not set; skipping. See docs/NEON.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        run: npm run db:migrate
